#服务器生产版 docker-compose.prod.yml
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network
    restart: unless-stopped

  php:
    image: codeyoursmile/haozhanzhan:latest
    networks:
      - app-network
    restart: unless-stopped

  mysql:
    image: docker.1panel.live/library/mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: haozhanzhan
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: